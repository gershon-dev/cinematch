<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | CineMatch</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">CineMatch</a>
    <form class="search-form" action="index.html" role="search">
      <label for="search-input" class="visually-hidden">Search</label>
      <input id="search-input" type="search" name="q" placeholder="Search…" autocomplete="off">
      <label for="search-type" class="visually-hidden">Search for</label>
      <select id="search-type" name="type">
        <option value="movie">Movies</option>
        <option value="person">People</option>
      </select>
      <button type="submit" class="btn btn--search">Search</button>
    </form>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Browse</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="favorites.html">Favorites</a>
    </nav>
  </header>
  <main>
    <div class="filter-bar" role="group" aria-label="Filter by genre">
      <div id="genre-filters" class="filter-bar__genres"></div>
      <button type="button" id="surprise-btn" class="btn btn--search">🎲 Surprise Me</button>
    </div>
    <section id="trending-section">
      <h2>Trending This Week</h2>
      <div id="trending" class="carousel"></div>
    </section>
    <section>
      <h2 id="results-heading">Popular Movies</h2>
      <div id="popular" class="poster-grid"></div>
    </section>
  </main>

  <dialog id="surprise-dialog" class="modal" aria-labelledby="surprise-title">
    <div class="dialog-body"></div>
    <div class="modal__actions">
      <button type="button" class="btn" data-again>Pick another</button>
      <button type="button" class="btn" data-close>Close</button>
    </div>
  </dialog>

  <footer class="site-footer"><p>Data from TMDB. Not endorsed or certified by TMDB.</p></footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
